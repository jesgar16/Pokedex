<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pokédex</title>
<meta name="theme-color" content="#C8102E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --rojo: #C8102E;
    --rojo-oscuro: #8B0A1E;
    --rojo-borde: #5E0713;
    --lcd: #C7D6BC;
    --lcd-oscuro: #24331F;
    --lente: #29B6F6;
    --amarillo: #FFCB05;
    --verde-led: #43D17A;
    --carcasa: #16161A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--carcasa);
    font-family: 'VT323', monospace;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .device {
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    background: linear-gradient(160deg, var(--rojo) 0%, var(--rojo-oscuro) 100%);
    border-left: 3px solid var(--rojo-borde);
    border-right: 3px solid var(--rojo-borde);
    display: flex;
    flex-direction: column;
  }

  /* ---- Panel superior: lente + LEDs ---- */
  .panel-superior {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px 12px;
    border-bottom: 4px solid var(--rojo-borde);
    position: relative;
  }
  .lente {
    width: 58px; height: 58px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #BFE9FF 0%, var(--lente) 40%, #0D5C8C 100%);
    border: 4px solid #ECECEC;
    box-shadow: 0 0 0 3px #9b9b9b, inset -4px -6px 10px rgba(0,0,0,.35);
    flex-shrink: 0;
  }
  .lente.escaneando { animation: pulso 0.9s ease-in-out infinite; }
  @keyframes pulso {
    0%,100% { box-shadow: 0 0 0 3px #9b9b9b, 0 0 6px 2px rgba(41,182,246,.4); }
    50%     { box-shadow: 0 0 0 3px #9b9b9b, 0 0 22px 8px rgba(41,182,246,.95); }
  }
  .leds { display: flex; gap: 8px; }
  .led { width: 13px; height: 13px; border-radius: 50%; border: 2px solid rgba(0,0,0,.35); }
  .led.r { background: #FF3B30; }
  .led.a { background: var(--amarillo); }
  .led.v { background: var(--verde-led); }
  .led.parpadeo { animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  .titulo {
    margin-left: auto;
    font-family: 'Press Start 2P', monospace;
    color: var(--amarillo);
    font-size: 13px;
    text-shadow: 2px 2px 0 rgba(0,0,0,.45);
    letter-spacing: 1px;
  }

  /* ---- Pantalla LCD ---- */
  .marco-pantalla {
    margin: 16px 14px 10px;
    background: #DADADA;
    border-radius: 10px 10px 10px 36px;
    padding: 16px 14px 18px;
    box-shadow: inset 0 -4px 8px rgba(0,0,0,.25);
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .pantalla {
    background: var(--lcd);
    border: 3px solid #5a6652;
    border-radius: 6px;
    color: var(--lcd-oscuro);
    flex: 1;
    padding: 12px;
    position: relative;
    overflow-y: auto;
    font-size: 21px;
    line-height: 1.25;
    box-shadow: inset 0 0 18px rgba(0,0,0,.22);
  }
  .pantalla::after { /* líneas de escaneo */
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.05) 2px 4px);
    pointer-events: none;
    border-radius: 4px;
  }
  .pantalla h2 {
    font-family: 'Press Start 2P', monospace;
    font-size: 15px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .numero { font-family: 'Press Start 2P', monospace; font-size: 10px; opacity: .75; display: block; margin-bottom: 8px; }
  .sprite-zona { display: flex; gap: 12px; align-items: flex-start; margin: 8px 0 10px; }
  .sprite-zona img {
    width: 110px; height: 110px;
    image-rendering: pixelated;
    background: rgba(255,255,255,.35);
    border: 2px solid var(--lcd-oscuro);
    border-radius: 4px;
    flex-shrink: 0;
  }
  .stats { font-size: 19px; }
  .tipos { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
  .tipo {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    padding: 5px 8px;
    border: 2px solid var(--lcd-oscuro);
    border-radius: 3px;
    background: rgba(255,255,255,.4);
    text-transform: uppercase;
  }
  .descripcion { margin-top: 8px; }
  .cursor { display: inline-block; width: 10px; height: 18px; background: var(--lcd-oscuro); animation: blink 1s steps(2) infinite; vertical-align: text-bottom; }
  .error-msg { color: #7a1d12; font-weight: bold; }
  .acciones-audio { display: flex; gap: 8px; margin-top: 12px; }
  .btn-lcd {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    padding: 9px 10px;
    background: var(--lcd-oscuro);
    color: var(--lcd);
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  .btn-lcd:active { transform: translateY(2px); }

  /* ---- Controles ---- */
  .controles {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 6px 18px 22px;
  }
  .btn-scan {
    flex: 1;
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: #fff;
    background: linear-gradient(180deg, #2F3136 0%, #131316 100%);
    border: 3px solid #000;
    border-radius: 10px;
    padding: 18px 10px;
    cursor: pointer;
    text-shadow: 1px 1px 0 #000;
    box-shadow: 0 5px 0 #000;
  }
  .btn-scan:active { transform: translateY(4px); box-shadow: 0 1px 0 #000; }
  .btn-scan:disabled, .btn-scan.ocupado { opacity: .55; pointer-events: none; }
  label.btn-scan { display: flex; align-items: center; justify-content: center; text-align: center; }
  .btn-vivo { font-size: 9px; padding: 11px 10px; background: linear-gradient(180deg, #3a3f52 0%, #1c1f2b 100%); }
  .video-vivo { width: 100%; border: 2px solid var(--lcd-oscuro); border-radius: 4px; background: #000; }
  .dpad {
    width: 64px; height: 64px; position: relative; flex-shrink: 0;
  }
  .dpad::before, .dpad::after {
    content: ''; position: absolute; background: #1d1d22; border-radius: 4px;
    box-shadow: inset 0 -3px 4px rgba(0,0,0,.6);
  }
  .dpad::before { left: 22px; top: 0; width: 20px; height: 64px; }
  .dpad::after  { top: 22px; left: 0; width: 64px; height: 20px; }

  /* ---- Historial ---- */
  .historial {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 18px 14px;
  }
  .historial:empty { display: none; }
  .chip {
    flex-shrink: 0;
    border: 2px solid rgba(0,0,0,.4);
    background: rgba(0,0,0,.25);
    border-radius: 8px;
    padding: 4px;
    cursor: pointer;
  }
  .chip img { width: 48px; height: 48px; image-rendering: pixelated; display: block; }

  input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="device">

  <div class="panel-superior">
    <div class="lente" id="lente"></div>
    <div class="leds">
      <div class="led r" id="ledR"></div>
      <div class="led a"></div>
      <div class="led v"></div>
    </div>
    <button id="btnConfig" title="Configurar clave API" style="background:none;border:2px solid rgba(0,0,0,.35);border-radius:6px;color:#fff;font-size:16px;padding:2px 7px;margin-left:10px;cursor:pointer;">⚙</button>
    <div class="titulo">POKÉDEX <span style="font-size:8px;opacity:.8">PWA</span></div>
  </div>

  <div class="marco-pantalla">
    <div class="pantalla" id="pantalla">
      <h2>Hola, entrenador.</h2>
      <p>Apunta la cámara a un pokémon de tu libro y presiona <b>ESCANEAR</b>.</p>
      <p style="margin-top:8px">Funciono incluso con dibujos a blanco y negro.<span class="cursor"></span></p>
    </div>
  </div>

  <div class="controles">
    <div class="dpad"></div>
    <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
      <label class="btn-scan" id="btnScan" for="camara" role="button">▶ ESCANEAR</label>
      <button class="btn-scan btn-vivo" id="btnVivo">📷 CÁMARA EN VIVO</button>
    </div>
  </div>

  <div class="historial" id="historial"></div>

  <input type="file" id="camara" accept="image/*" capture="environment">
</div>

<script>
const TIPOS_ES = {
  normal:'Normal', fire:'Fuego', water:'Agua', electric:'Eléctrico', grass:'Planta',
  ice:'Hielo', fighting:'Lucha', poison:'Veneno', ground:'Tierra', flying:'Volador',
  psychic:'Psíquico', bug:'Bicho', rock:'Roca', ghost:'Fantasma', dragon:'Dragón',
  dark:'Siniestro', steel:'Acero', fairy:'Hada'
};

const pantalla = document.getElementById('pantalla');
const btnScan  = document.getElementById('btnScan');
const camara   = document.getElementById('camara');
const lente    = document.getElementById('lente');
const ledR     = document.getElementById('ledR');
const historialEl = document.getElementById('historial');

let historial = []; // {d, ident}
let vozES = null;

// ---- Almacenamiento local (clave API e historial) ----
const LS_KEY = 'pokedex_api_key';
const LS_HIST = 'pokedex_historial';
function obtenerClave() { try { return localStorage.getItem(LS_KEY) || ''; } catch (e) { return ''; } }
function guardarClave(k) { try { localStorage.setItem(LS_KEY, k.trim()); } catch (e) {} }
function guardarHistorial() { try { localStorage.setItem(LS_HIST, JSON.stringify(historial.slice(0, 60))); } catch (e) {} }
function cargarHistorialGuardado() {
  try { historial = JSON.parse(localStorage.getItem(LS_HIST) || '[]'); } catch (e) { historial = []; }
  pintarHistorial();
}

function pantallaConfig() {
  const actual = obtenerClave();
  mostrar(`
    <h2>Configuración</h2>
    <p>Pega tu clave de API de Anthropic (empieza con <b>sk-ant-</b>). La consigues en console.anthropic.com y se guarda solo en este teléfono.</p>
    <input id="inputClave" type="password" value="${actual}" placeholder="sk-ant-..."
      style="width:100%;margin:10px 0;padding:10px;font-family:'VT323',monospace;font-size:18px;background:rgba(255,255,255,.5);border:2px solid var(--lcd-oscuro);border-radius:4px;color:var(--lcd-oscuro);">
    <div class="acciones-audio">
      <button class="btn-lcd" id="btnGuardarClave">💾 GUARDAR</button>
    </div>
  `);
  document.getElementById('btnGuardarClave').onclick = () => {
    const v = document.getElementById('inputClave').value.trim();
    if (!v.startsWith('sk-ant-')) {
      alert('La clave debe empezar con sk-ant-');
      return;
    }
    guardarClave(v);
    mostrar('<h2>¡Clave guardada!</h2><p>Apunta la cámara a un pokémon de tu libro y presiona <b>ESCANEAR</b>.<span class="cursor"></span></p>');
  };
}
document.getElementById('btnConfig').addEventListener('click', pantallaConfig);
const TTS_OK = (typeof window !== 'undefined') && ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);

// Elegir voz en español (preferir latino)
function cargarVoz() {
  if (!TTS_OK) return;
  try {
    const voces = window.speechSynthesis.getVoices();
    vozES = voces.find(v => /es[-_](419|MX|US|CO|AR)/i.test(v.lang))
         || voces.find(v => v.lang.toLowerCase().startsWith('es'))
         || null;
  } catch (e) { /* sin voz disponible */ }
}
if (TTS_OK) {
  window.speechSynthesis.onvoiceschanged = cargarVoz;
  cargarVoz();
}

// El label #btnScan abre el input de archivo de forma nativa (sin JS),
// que es más compatible con visores restringidos.

camara.addEventListener('change', async (e) => {
  const archivo = e.target.files[0];
  if (!archivo) return;
  camara.value = '';
  await procesarFoto(archivo);
});

// ---- Plan B: cámara en vivo con getUserMedia ----
const btnVivo = document.getElementById('btnVivo');
let streamActivo = null;

btnVivo.addEventListener('click', async () => {
  detenerCamara();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    mostrar('<h2>Sin acceso</h2><p class="error-msg">Este visor no expone la cámara en vivo (getUserMedia no disponible).</p>');
    return;
  }
  try {
    streamActivo = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false
    });
    mostrar(`
      <h2>Cámara en vivo</h2>
      <video class="video-vivo" id="videoVivo" autoplay playsinline muted></video>
      <div class="acciones-audio">
        <button class="btn-lcd" id="btnCapturar">📸 CAPTURAR</button>
        <button class="btn-lcd" id="btnCerrarCam">✕ CERRAR</button>
      </div>
    `);
    const video = document.getElementById('videoVivo');
    video.srcObject = streamActivo;
    document.getElementById('btnCapturar').onclick = () => {
      const c = document.createElement('canvas');
      const lado = Math.min(1024, Math.max(video.videoWidth, video.videoHeight));
      const escala = lado / Math.max(video.videoWidth, video.videoHeight);
      c.width = Math.round(video.videoWidth * escala);
      c.height = Math.round(video.videoHeight * escala);
      c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
      const base64 = c.toDataURL('image/jpeg', 0.85).split(',')[1];
      detenerCamara();
      analizar(base64);
    };
    document.getElementById('btnCerrarCam').onclick = () => {
      detenerCamara();
      mostrar('<h2>Listo.</h2><p>Presiona ESCANEAR o CÁMARA EN VIVO cuando quieras.<span class="cursor"></span></p>');
    };
  } catch (err) {
    mostrar(`<h2>Cámara bloqueada</h2><p class="error-msg">${err.name}: ${err.message}</p><p style="margin-top:8px">El visor no permitió el acceso. Intenta con el botón ESCANEAR, o abre claude.ai desde Chrome.</p>`);
  }
});

function detenerCamara() {
  if (streamActivo) {
    streamActivo.getTracks().forEach(t => t.stop());
    streamActivo = null;
  }
}

function modoEscaneo(activo) {
  btnScan.classList.toggle('ocupado', activo);
  btnVivo.disabled = activo;
  lente.classList.toggle('escaneando', activo);
  ledR.classList.toggle('parpadeo', activo);
  btnScan.textContent = activo ? '… ANALIZANDO' : '▶ ESCANEAR';
}

function mostrar(html) { pantalla.innerHTML = html; pantalla.scrollTop = 0; }

async function procesarFoto(archivo) {
  modoEscaneo(true);
  mostrar('<h2>Escaneando…</h2><p>Leyendo la imagen<span class="cursor"></span></p>');
  try {
    const base64 = await redimensionar(archivo, 1024);
    modoEscaneo(false);
    await analizar(base64);
  } catch (err) {
    modoEscaneo(false);
    mostrar(`<h2>Error</h2><p class="error-msg">${err.message}</p>`);
  }
}

async function analizar(base64) {
  modoEscaneo(true);
  mostrar('<h2>Escaneando…</h2><p>Analizando la imagen<span class="cursor"></span></p>');
  try {
    const ident = await identificarPokemon(base64);
    if (!ident || !ident.name) throw new Error('No pude identificar ningún pokémon en la foto. Intenta acercarte más o con mejor luz.');
    mostrar(`<h2>¡${ident.spanishName || ident.name}!</h2><p>Consultando datos<span class="cursor"></span></p>`);
    const datos = await consultarPokeapi(ident.name);
    renderizar(datos, ident);
    agregarHistorial(datos, ident);
    reproducirGrito(datos);
    setTimeout(() => hablar(textoVoz(datos, ident)), 1200);
  } catch (err) {
    mostrar(`<h2>Error</h2><p class="error-msg">${err.message}</p><p style="margin-top:8px">Presiona ESCANEAR para intentar de nuevo.</p>`);
  } finally {
    modoEscaneo(false);
  }
}

// Redimensionar y convertir a base64 JPEG
function redimensionar(archivo, maxLado) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * escala);
      c.height = Math.round(img.height * escala);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => reject(new Error('No se pudo leer la imagen.'));
    img.src = URL.createObjectURL(archivo);
  });
}

// Identificación con IA de visión
async function identificarPokemon(base64) {
  const clave = obtenerClave();
  if (!clave) {
    pantallaConfig();
    throw new Error('Primero configura tu clave de API (botón ⚙).');
  }
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': clave,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: base64 } },
          { type: 'text', text:
`Identifica el Pokémon en esta imagen. Puede ser un dibujo a blanco y negro, line art de un libro para colorear, o una figura/foto.
Responde SOLO con JSON válido, sin texto adicional ni markdown:
{"name":"nombre-en-ingles-minusculas-formato-pokeapi","spanishName":"Nombre en español","confidence":0-100}
Si no hay ningún Pokémon reconocible, responde: {"name":null}` }
        ]
      }]
    })
  });
  if (resp.status === 401 || resp.status === 403) throw new Error('Clave de API inválida o vencida. Revísala con el botón ⚙.');
  if (!resp.ok) throw new Error('Falló la conexión con la IA (' + resp.status + ').');
  const data = await resp.json();
  const texto = data.content.filter(b => b.type === 'text').map(b => b.text).join('\n');
  const limpio = texto.replace(/```json|```/g, '').trim();
  try { return JSON.parse(limpio); }
  catch { throw new Error('Respuesta de IA inesperada. Intenta de nuevo.'); }
}

// Datos de PokéAPI (pokemon + species para texto en español)
async function consultarPokeapi(nombre) {
  const slug = nombre.toLowerCase().trim().replace(/\s+/g, '-');
  const [rp, rs] = await Promise.all([
    fetch('https://pokeapi.co/api/v2/pokemon/' + slug),
    fetch('https://pokeapi.co/api/v2/pokemon-species/' + slug)
  ]);
  if (!rp.ok) throw new Error('"' + nombre + '" no aparece en la PokéAPI.');
  const p = await rp.json();
  const s = rs.ok ? await rs.json() : null;

  let descripcion = '', genero = '', nombreES = '';
  if (s) {
    const fl = s.flavor_text_entries.find(f => f.language.name === 'es');
    descripcion = fl ? fl.flavor_text.replace(/[\n\f]/g, ' ') : '';
    const gn = s.genera ? s.genera.find(g => g.language.name === 'es') : null;
    genero = gn ? gn.genus : '';
    const nm = s.names ? s.names.find(n => n.language.name === 'es') : null;
    nombreES = nm ? nm.name : '';
  }
  return {
    id: p.id,
    nombre: nombreES || (p.name.charAt(0).toUpperCase() + p.name.slice(1)),
    tipos: p.types.map(t => TIPOS_ES[t.type.name] || t.type.name),
    altura: (p.height / 10).toFixed(1),
    peso: (p.weight / 10).toFixed(1),
    sprite: p.sprites.other && p.sprites.other['official-artwork'] && p.sprites.other['official-artwork'].front_default
            || p.sprites.front_default,
    spritePixel: p.sprites.front_default,
    grito: p.cries ? (p.cries.latest || p.cries.legacy) : null,
    descripcion, genero
  };
}

function renderizar(d, ident) {
  const conf = ident.confidence ? `<span style="opacity:.7">(confianza ${ident.confidence}%)</span>` : '';
  mostrar(`
    <span class="numero">N.º ${String(d.id).padStart(3, '0')}</span>
    <h2>${d.nombre}</h2>
    <div class="sprite-zona">
      <img src="${d.sprite}" alt="${d.nombre}">
      <div class="stats">
        ${d.genero ? d.genero + '<br>' : ''}
        Altura: ${d.altura} m<br>
        Peso: ${d.peso} kg<br>
        ${conf}
      </div>
    </div>
    <div class="tipos">${d.tipos.map(t => '<span class="tipo">' + t + '</span>').join('')}</div>
    <p class="descripcion">${d.descripcion || 'Sin descripción disponible en español.'}</p>
    <div class="acciones-audio">
      <button class="btn-lcd" id="btnGrito">♪ GRITO</button>
      ${TTS_OK ? '<button class="btn-lcd" id="btnVoz">🔊 LEER</button>' : ''}
    </div>
  `);
  document.getElementById('btnGrito').onclick = () => reproducirGrito(d);
  const bv = document.getElementById('btnVoz');
  if (bv) bv.onclick = () => hablar(textoVoz(d, ident));
}

function textoVoz(d) {
  let t = d.nombre + '. ';
  if (d.genero) t += d.genero + '. ';
  t += 'Tipo ' + d.tipos.join(' y ') + '. ';
  if (d.descripcion) t += d.descripcion;
  return t;
}

function reproducirGrito(d) {
  if (!d.grito) return;
  const audio = new Audio(d.grito);
  audio.volume = 0.7;
  audio.play().catch(() => {});
}

// Voz estilo Pokédex (TTS español, tono bajo y pausado)
function hablar(texto) {
  if (!TTS_OK) return;
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(texto);
    if (!vozES) cargarVoz();
    if (vozES) u.voice = vozES;
    u.lang = vozES ? vozES.lang : 'es-MX';
    u.rate = 0.92;
    u.pitch = 0.7;
    window.speechSynthesis.speak(u);
  } catch (e) { /* TTS no disponible en este visor */ }
}

function agregarHistorial(d, ident) {
  if (historial.some(h => h.d.id === d.id)) return;
  historial.unshift({ d, ident });
  guardarHistorial();
  pintarHistorial();
}

function pintarHistorial() {
  historialEl.innerHTML = historial.map((h, i) =>
    `<div class="chip" data-i="${i}"><img src="${h.d.spritePixel || h.d.sprite}" alt="${h.d.nombre}"></div>`
  ).join('');
  historialEl.querySelectorAll('.chip').forEach(ch => {
    ch.onclick = () => {
      const h = historial[+ch.dataset.i];
      renderizar(h.d, h.ident);
      reproducirGrito(h.d);
    };
  });
}

// ---- PWA: service worker e inicio ----
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
cargarHistorialGuardado();
if (!obtenerClave()) pantallaConfig();
</script>
</body>
</html>
